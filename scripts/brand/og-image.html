<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Social share image source (dev only)</title>
  <meta name="robots" content="noindex">
  <!-- Dev-only source for the 1200x630 social share image (og:image).
       To regenerate: open http://localhost:5500/scripts/brand/og-image.html at a
       1200x630 viewport, screenshot it to assets/_source/brand/og-image.png, then
       run `npm run images`. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600&amp;family=Playfair+Display:wght@600&amp;display=block">
  <style>
    html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
    .card {
      position: relative; display: grid; grid-template-columns: 1fr 430px;
      width: 1200px; height: 630px; box-sizing: border-box;
      background: #0c0f24; color: #ffffff; font-family: "Inter", sans-serif;
    }
    .text { padding: 72px 0 64px 80px; display: flex; flex-direction: column; justify-content: center; }
    .eyebrow { color: #91a3c9; font-size: 22px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; margin: 0 0 28px; }
    .name { font-family: "Playfair Display", serif; font-weight: 600; font-size: 76px; line-height: 1.05; margin: 0; }
    .title { font-size: 30px; font-weight: 500; letter-spacing: 0.04em; color: #ffffff; margin: 14px 0 8px; }
    .team { font-size: 22px; font-weight: 500; color: #b5b3b9; margin: 0 0 34px; }
    .tagline { font-family: "Playfair Display", serif; font-size: 34px; line-height: 1.3; color: #d3dae9; margin: 0; max-width: 620px; }
    .rule { width: 96px; height: 6px; background: #19469d; margin: 0 0 30px; border-radius: 3px; }
    .photo { position: relative; background: #19469d; overflow: hidden; }
    .photo img { position: absolute; bottom: 0; left: 50%; transform: translateX(-50%); height: 600px; width: auto; }
    .footer { position: absolute; left: 80px; bottom: 40px; color: #b5b3b9; font-size: 20px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="text">
      <p class="eyebrow">Newton, MA &amp; nearby towns</p>
      <p class="name">Jared Cohen</p>
      <p class="title">MA REALTOR®</p>
      <p class="team">Castles Unlimited team · brokered by eXp Realty</p>
      <div class="rule"></div>
      <p class="tagline">From Newton to the neighborhoods beyond — real estate done right.</p>
    </div>
    <div class="photo">
      <img src="/assets/images/headshots/headshot-transparent-1200.webp" alt="">
    </div>
  </div>
</body>
</html>
