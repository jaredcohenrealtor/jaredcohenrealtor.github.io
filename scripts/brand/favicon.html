<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Favicon source (dev only)</title>
  <meta name="robots" content="noindex">
  <!-- Dev-only source for the "JC" favicon. To regenerate: open
       http://localhost:5500/scripts/brand/favicon.html at a 512x512 viewport,
       screenshot it to assets/_source/brand/favicon-512.png, then run
       `npm run images`. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&amp;display=block">
  <style>
    html, body { margin: 0; width: 512px; height: 512px; background: transparent; }
    .mark {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      width: 512px; height: 512px; box-sizing: border-box;
      background: #0c0f24; border-radius: 96px;
      color: #ffffff; font-family: "Playfair Display", serif; font-weight: 700;
      font-size: 270px; letter-spacing: -8px; line-height: 0.9;
    }
    .bar { width: 240px; height: 24px; margin-top: 64px; background: #19469d; border-radius: 12px; }
  </style>
</head>
<body>
  <div class="mark"><span>JC</span><span class="bar"></span></div>
</body>
</html>
